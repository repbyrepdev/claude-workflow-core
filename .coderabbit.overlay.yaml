# Plugin-specific CodeRabbit overlay for claude-workflow-core.
# Merged with .coderabbit.base.yaml by scripts/compose-coderabbit.sh →
# .coderabbit.yaml (overlay scalars win; overlay arrays append to base).
# This file is per-repo (NOT byte-gated); .coderabbit.base.yaml is the SSOT.

tone_instructions: >-
  Direct and concise. This IS the claude-workflow-core plugin: hooks,
  pre-commit-hooks, skill wrappers, bats, .github SSOT, propagation engine.
  No app code. Prefer fail-closed; flag fail-open suppression, hardcoded
  paths, SSOT dup.

reviews:
  path_instructions:
    - path: "pre-commit-hooks/*.sh"
      instructions: >-
        Pre-commit gate. REQUIRE `set -euo pipefail` on line 2. REQUIRE any
        bypass env var is documented in the header. REQUIRE it matches only
        staged files (git diff --cached). Exit 0 pass / 1 fail / 2 usage. FLAG
        hardcoded agent / anti-pattern lists that duplicate
        .github/commit-template.yml or .github/labels.yml SSOT (read via yq).
    - path: "scripts/*.sh"
      instructions: >-
        Plugin script (bootstrap / hash-drift / refresh-from-source / compose /
        release / test). REQUIRE `set -euo pipefail`. REQUIRE fail-closed on
        yq/jq/git errors — no `|| true` masking. Propagation scripts: a declared
        SSOT file that is missing must ABORT (exit 2), never silently skip — a
        silent skip is a coverage hole that disables the consumer drift gate.
    - path: ".claude/tests/**/*.bats"
      instructions: >-
        Bats test. The `# covers:` annotation is PER-FILE, not per-test: exactly
        ONE file-header line (space-separated targets) near the top of the FILE,
        read via grep -m1 — a SECOND covers line anywhere in the file is
        silently dropped, so do NOT request per-test covers annotations and do
        NOT flag a new @test block as "missing" one. Before flagging a missing
        covers line on a diff hunk, check the FILE HEADER (it is usually outside
        the hunk); flag only when the whole file truly has no covers line, or
        has more than one. REQUIRE behavior assertions (status + stdout/stderr
        content), not mere source-presence. REQUIRE trailing newline. FLAG
        skip-as-pass guards (`|| skip`) that silently neuter coverage on a
        missing optional tool.
    - path: ".claude/audit/prove-yourself.jsonl"
      instructions: >-
        APPEND-ONLY audit log. Each record's finding_text quotes the ORIGINAL
        finding verbatim — its action verb is a historical artifact, NOT a
        pending instruction. DO NOT suggest mutating prior records or rewriting
        entries. FLAG ONLY malformed JSON, missing required fields, or duplicate
        finding_id+ts pairs.
  # No reviews.labeling_instructions in this overlay (deliberate — #2256).
  # The base ships the single universal area:infrastructure PR label, whose
  # .github/labels.yml definition already covers "Skills, hooks, scripts,
  # workflows, repo infrastructure". The plugin uses that ONE broad area
  # label, NOT granular area:hooks/skills/workflows or type:test/type:secrets
  # — those were never defined in any repo's labels.yml (labels-spec.md
  # two-tier rule: labels.yml is generic-only; domain labels live in a
  # consumer overlay AND must be defined in that repo's labels.yml). Re-adding
  # domain labeling here would tell CR to apply labels no repo defines — the
  # exact media-server #956 drift this change removes at root.

# code_generation (#2297/#2272): plugin-ONLY CR docstring + unit-test generation
# guidance for this repo's shell surface (scripts/hooks/skills/_lib). Lives in the
# OVERLAY (not .coderabbit.base.yaml) so it does NOT propagate to consumers via
# bootstrap — the base stays repo-agnostic; a consumer wanting code-gen guidance
# adds its own overlay block. Schema: path_instructions nests under docstrings /
# unit_tests, NOT directly under code_generation (CodeRabbit config reference:
# docs.coderabbit.ai/reference/configuration) — a flat form is silently ignored,
# so coderabbit-config-sync.bats pins the correct nesting.
code_generation:
  docstrings:
    path_instructions:
      - path: "scripts/*.sh"
        instructions: >-
          Plugin propagation/CI script. Generate a header-comment block (purpose,
          usage/args, exit codes 0 pass / 1 fail / 2 usage) in the repo's existing
          style; keep `set -euo pipefail` on line 2 directly under the shebang.
          Reference the SSOT file a value derives from (.github/*.yml, read via yq)
          rather than restating it.
      - path: "pre-commit-hooks/*.sh"
        instructions: >-
          Pre-commit gate. Keep `set -euo pipefail` on line 2 (directly under the
          shebang); document the staged-files scope (git diff --cached), the bypass
          env var, and the 0/1/2 exit contract in the header.
      - path: "hooks/*.sh"
        instructions: >-
          Generic .claude hook. Keep `set -euo pipefail` on line 2 (directly under
          the shebang). Document the `# event:` it fires on and any bypass env var
          in the header; note repo_guard_require gating if present.
      - path: "skills/*/run.sh"
        instructions: >-
          Skill wrapper. Keep `set -euo pipefail` on line 2 directly under the
          shebang. Document the SKILL_WRAPPER side-effects it runs (preflight gates,
          Copilot draft, post-commit cascade) so callers do not bypass it.
      - path: "_lib/*.sh"
        instructions: >-
          Shared helper sourced by hooks/scripts. Document the functions it exports
          and their contracts; note it must stay bash-3.2 compatible (macOS — no
          mapfile / associative-array assumptions).
  unit_tests:
    path_instructions:
      - path: "**/*.sh"
        instructions: >-
          Generate bats tests, not ad-hoc scripts. REQUIRE exactly ONE `# covers:`
          line; assert behavior (exit status + stdout/stderr content), not mere
          source-presence; use `mktemp -d` fixtures; end the file with a trailing
          newline; never guard a required path behind `|| skip` (a silent pass).
