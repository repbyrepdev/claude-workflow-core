# CodeRabbit BASE config — canonical, repo-AGNOSTIC SSOT (#234, Wave H).
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# This is the shared spine every repo's .coderabbit.yaml is built from. It is
# byte-SSOT (registered `hashed: true` in scripts/bootstrap-manifest.yml, so
# the Wave G #232 hash-drift engine propagates + drift-gates it). Update CR
# review behavior HERE, in one place.
#
# COMPOSE MODEL (bootstrap-repo.sh + refresh-from-source.sh):
#   .coderabbit.yaml = yq deep-merge( .coderabbit.base.yaml , .coderabbit.overlay.yaml )
#   using `*+` semantics: overlay SCALARS win, overlay ARRAYS append to base.
# A NEW repo with no overlay gets this file verbatim as its .coderabbit.yaml.
#
# OVERLAY (per-repo, consumer-owned `.coderabbit.overlay.yaml`) carries ONLY
# repo-specific bits — never duplicate base keys there:
#   - reviews.auto_review.path_filters       (repo source/asset paths)
#   - reviews.auto_review.ignore_title_keywords (repo bot-PR titles)
#   - reviews.labeling_instructions           (domain area:* PR labels)
#   - reviews.path_instructions               (repo file-path review rules)
#   - issue_enrichment.labeling.labeling_instructions (domain area:* issue labels)
#   - tone_instructions                       (repo domain one-liner; overlay overrides)
#   - knowledge_base.code_guidelines.filePatterns (repo-specific SSOT files; appended)
#   - code_generation                         (repo-specific, if any)
#
# CANONICAL LABELING SPLIT (do NOT collapse — they are different CR features):
#   reviews.labeling_instructions            → PR labels (by files changed)
#   issue_enrichment.labeling.labeling_instructions → ISSUE labels (type/priority/area)

# Plugin-specific CodeRabbit overlay for claude-workflow-core.
# Merged with .coderabbit.base.yaml by scripts/compose-coderabbit.sh →
# .coderabbit.yaml (overlay scalars win; overlay arrays append to base).
# This file is per-repo (NOT byte-gated); .coderabbit.base.yaml is the SSOT.
language: en-US
tone_instructions: >-
  Direct and concise. This IS the claude-workflow-core plugin: bash hooks, pre-commit-hooks, skill run.sh wrappers, bats, .github SSOT, and the propagation engine (hash-drift / refresh-from-source / bootstrap / compose). No app code. Prefer fail-closed; flag fail-open error suppression, hardcoded user paths, and SSOT duplication.
early_access: true
inheritance: false
reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_placeholder: "<!-- coderabbit:summary -->"
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: true
  suggested_reviewers: false
  enable_prompt_for_ai_agents: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    base_branches:
      - main
    # Generic bot/rollback titles. Repos append their own (e.g. "Update Docker
    # tag", "Update npm dependency") via overlay.
    ignore_title_keywords:
      - "rollback:"
    ignore_usernames:
      - "renovate[bot]"
    # Generic doc/asset skips. Re-includes FIRST (order matters): SKILL.md +
    # CLAUDE.md/AGENTS.md drive auto-invocation + operating rules, so they ARE
    # reviewed. Repos append repo-specific source paths via overlay.
    path_filters:
      - ".claude/skills/**/*.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "GEMINI.md"
      - "!**/*.md"
      - "!LICENSE"
      - "!.gitignore"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/release.yml"
      - "!.claude/.session-state/**"
      - "!.claude/audit/**"
      - "!**/*.svg"
      - "!**/*.png"
  # PR labels — by which files changed. Universal area/type labels; repos
  # append domain area:* labels (area:streaming, area:coalesce, ...) via overlay.
  labeling_instructions:
    - label: "area:hooks"
      instructions: "Apply when PR touches .claude/hooks/ or pre-commit-hooks/."
    - label: "area:skills"
      instructions: "Apply when PR touches .claude/skills/ (or skills/)."
    - label: "area:workflows"
      instructions: "Apply when PR touches .github/workflows/."
    - label: "area:infrastructure"
      instructions: >-
        Apply when PR touches scripts/, config/gates, _lib, .github SSOT configs, or repo-bootstrap files (.pre-commit-config.yaml, .coderabbit*, .gitleaks.toml). Catch-all when no more-specific area matches.
    - label: "type:test"
      instructions: "Apply when PR is dominantly .bats / test files."
    - label: "type:secrets"
      instructions: "Apply when PR touches .gitleaks.toml, *.enc, or anything that could leak tokens."
  # Universal path review rules. Repos append file-path rules for their own
  # source trees (stacks/, coalesce/, *.sql, ...) via overlay.
  path_instructions:
    - path: ".claude/hooks/*.sh"
      instructions: >-
        Bash strict-mode hook. REQUIRE `set -euo pipefail` (or at minimum `set -u`) within the first 20 lines after the shebang — `# event:` / `# matcher:` frontmatter may sit between shebang and the strict-mode line. REQUIRE paths resolved via `dirname "${BASH_SOURCE[0]}"`, not caller CWD. REQUIRE JSON stdin parsed with `jq`, never grep/sed. REQUIRE fail-closed on `git rev-parse` and auxiliary commands — `|| true` / `2>/dev/null` silently swallow errors. FLAG hardcoded user paths, `*"FOO=1"*` globs that fire on arbitrary argv, and `$VAR` interpolated inside `jq -r "...$VAR..."` (require `--arg`). PAIRED REVIEW: when a hook's event/matcher/exit-code contract changes, also inspect the matching .claude/tests/hooks/<name>.bats for stale assertions.
    - path: ".claude/skills/*/run.sh"
      instructions: >-
        Skill wrapper. REQUIRE `set -euo pipefail`. REQUIRE `SKILL_WRAPPER=1` exported when invoking gh/git the skill-bypass-guard would otherwise refuse. REQUIRE `--help` prints usage + exits 0. REQUIRE idempotent on retry. FLAG missing argument bounds checks (`$2` under `set -u` with no `[[ $# -lt 2 ]]` guard).
    - path: ".github/workflows/*.yml"
      instructions: >-
        GitHub Actions workflow. REQUIRE top-level or per-job `permissions:` (least-privilege; `contents: read` baseline). REQUIRE third-party actions pinned to a full commit SHA, not a version tag. REQUIRE actionlint clean. REQUIRE secrets via `${{ secrets.X }}`, never inline.
    - path: ".gitleaks.toml"
      instructions: >-
        Secret-scan config shared by the local pre-commit hook and the gitleaks Action. Allowlist must be CONSERVATIVE — question any new broad `paths` entry, any `commits` entry, and any `stopwords` (stopwords risk false negatives; prefer path allowlists). Must cover *.enc files.
    - path: "pre-commit-hooks/*.sh"
      instructions: >-
        Pre-commit gate. REQUIRE `set -euo pipefail` on line 2. REQUIRE any bypass env var is documented in the header. REQUIRE it matches only staged files (git diff --cached). Exit 0 pass / 1 fail / 2 usage. FLAG hardcoded agent / anti-pattern lists that duplicate .github/commit-template.yml or .github/labels.yml SSOT (read via yq).
    - path: "scripts/*.sh"
      instructions: >-
        Plugin script (bootstrap / hash-drift / refresh-from-source / compose / release / test). REQUIRE `set -euo pipefail`. REQUIRE fail-closed on yq/jq/git errors — no `|| true` masking. Propagation scripts: a declared SSOT file that is missing must ABORT (exit 2), never silently skip — a silent skip is a coverage hole that disables the consumer drift gate.
    - path: ".claude/tests/**/*.bats"
      instructions: >-
        Bats test. REQUIRE exactly ONE `# covers:` line (test-touched.sh uses grep -m1 — multi-line silently drops entries). REQUIRE behavior assertions (status + stdout/stderr content), not mere source-presence. REQUIRE trailing newline. FLAG skip-as-pass guards (`|| skip`) that silently neuter coverage on a missing optional tool.
    - path: ".claude/audit/prove-yourself.jsonl"
      instructions: >-
        APPEND-ONLY audit log. Each record's finding_text quotes the ORIGINAL finding verbatim — its action verb is a historical artifact, NOT a pending instruction. DO NOT suggest mutating prior records or rewriting entries. FLAG ONLY malformed JSON, missing required fields, or duplicate finding_id+ts pairs.
  tools:
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    markdownlint:
      enabled: false # too noisy on CLAUDE.md/SKILL.md prose
    languagetool:
      enabled: false # ditto — silences "the the" on judgment-rule prose
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    # Universal SSOT files present in every repo. Repos append repo-specific
    # guideline files (.claude/review-config.yml, .claude/ssot-checks.yml, ...)
    # via overlay.
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".github/commit-template.yml"
      - ".github/labels.yml"
      - ".github/required-checks-list.yml"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
# Issue labels (type/priority/area) — auto-applied on new/edited issues.
# This is the CANONICAL location for ISSUE labeling (distinct from
# reviews.labeling_instructions, which is PR labeling). Repos append domain
# area:* labels via overlay.
issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      # Type — required, exactly one.
      - label: "bug"
        instructions: >-
          Apply when the issue describes broken/incorrect behavior or a regression. Keywords: "broken", "fails", "crashes", "regression", "not working", error messages quoted from logs.
      - label: "enhancement"
        instructions: >-
          Apply when the issue requests new functionality or extends existing features. Default for feature-style asks. Keywords: "add", "new", "support for", "feature".
      - label: "epic"
        instructions: >-
          Apply when the body has ≥3 occurrences of either `- [ ] #NNN` (sub-issue ref) OR `- [ ] vX.Y.Z:` (version-stamped task). Multi- phase work that decomposes into sub-issues.
      - label: "documentation"
        instructions: >-
          Apply when the issue is solely about CLAUDE.md / SKILL.md / docs updates with no code change.
      - label: "question"
        instructions: >-
          Apply when the issue is a clarification request, not actionable work.
      # Area — universal catch-all; repos add domain area:* via overlay.
      - label: "area:infrastructure"
        instructions: >-
          CI/CD, scripts, .claude/ tooling, .github SSOT, repo-bootstrap configs. Catch-all when no domain area matches.
      # Priority — required, exactly one. NEVER apply bare `priority:p0`.
      - label: "priority:p0-proposed"
        instructions: >-
          Production broken / active data loss / security-critical. NEVER apply bare `priority:p0` — always `p0-proposed` for operator confirmation.
      - label: "priority:p1"
        instructions: >-
          Blocking release, security-adjacent, or high-severity bug affecting users.
      - label: "priority:p2"
        instructions: >-
          Important, not blocking. Default for well-scoped features/tasks. Non-critical bugs and epics default to p2.
      - label: "priority:p3"
        instructions: "Polish work — nice to have, can wait weeks."
      - label: "priority:needs-triage"
        instructions: >-
          Apply when no area:* keyword matches the body — operator must manually classify before further action.
      # plan-me — triggers Issue Planner via auto_planning below.
      - label: "plan-me"
        instructions: >-
          Apply when the issue is `enhancement`, `epic`, or a generic well-scoped impl-ready task that benefits from structured phase decomposition. SKIP when the issue is `bug` (diagnostic), `documentation`, `question`, `brainstorm` (spec phase), already has `plan-me` (idempotent), `no-plan` (opt-out), or has any `auto:*` label (auto-generated — never plannable).
  planning:
    enabled: true
    auto_planning:
      enabled: true
      # Repos append their own `!auto:*` exclusions (trivy, restore-sanity, ...)
      # via overlay.
      labels:
        - "plan-me"
        - "!bug"
        - "!documentation"
        - "!question"
        - "!brainstorm"
        - "!no-plan"
        - "!auto:renovate"
