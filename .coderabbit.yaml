  # PR labels — by which files changed. Base ships ONLY the universal
  # area:infrastructure catch-all (present in every consumer's labels.yml).
  # Domain labels — area:hooks/skills/workflows, type:test/secrets, plus a
  # consumer's own area:streaming/area:coalesce/... — are repo-specific and
  # come via each repo's .coderabbit.overlay.yaml. A consumer whose
  # .github/labels.yml lacks a label must NOT be told to apply it (#2256:
  # media-server #956 flagged the 5 plugin labels as drift — absent in its
  # taxonomy). labels.yml is template-with-overrides, NOT byte-SSOT, so this
  # base must stay repo-agnostic.
  labeling_instructions:
    - label: "area:infrastructure"
      instructions: >-
        Apply when PR touches scripts/, config/gates, _lib, .github SSOT configs, or repo-bootstrap files (.pre-commit-config.yaml, .coderabbit*, .gitleaks.toml). Catch-all when no more-specific area matches.
  # Universal path review rules. Repos append file-path rules for their own
  # source trees (stacks/, coalesce/, *.sql, ...) via overlay.
  path_instructions:
    - path: ".claude/hooks/*.sh"
      instructions: >-
        Bash strict-mode hook. REQUIRE `set -euo pipefail` (or at minimum `set -u`) within the first 20 lines after the shebang — `# event:` / `# matcher:` frontmatter may sit between shebang and the strict-mode line. REQUIRE paths resolved via `dirname "${BASH_SOURCE[0]}"`, not caller CWD. REQUIRE JSON stdin parsed with `jq`, never grep/sed. REQUIRE fail-closed on `git rev-parse` and auxiliary commands — `|| true` / `2>/dev/null` silently swallow errors. FLAG hardcoded user paths, `*"FOO=1"*` globs that fire on arbitrary argv, and `$VAR` interpolated inside `jq -r "...$VAR..."` (require `--arg`). PAIRED REVIEW: IF a matching .claude/tests/hooks/<name>.bats EXISTS in this repo, inspect it for STALE assertions when the hook's event/matcher/exit-code contract changes. Do NOT request or flag a MISSING paired test — most .claude/hooks/*.sh are vendored byte-identical mirrors of an upstream plugin (claude-workflow-core) whose canonical tests live upstream and are drift-gate-enforced; a consumer having no local .bats is expected and correct, not a coverage gap.
    - path: ".claude/skills/*/run.sh"
      instructions: >-
        Skill wrapper. REQUIRE `set -euo pipefail`. REQUIRE `SKILL_WRAPPER=1` exported when invoking gh/git the skill-bypass-guard would otherwise refuse. REQUIRE `--help` prints usage + exits 0. REQUIRE idempotent on retry. FLAG missing argument bounds checks (`$2` under `set -u` with no `[[ $# -lt 2 ]]` guard).
    - path: ".github/workflows/*.yml"
      instructions: >-
        GitHub Actions workflow. REQUIRE top-level or per-job `permissions:` (least-privilege; `contents: read` baseline). REQUIRE third-party actions pinned to a full commit SHA, not a version tag. REQUIRE actionlint clean. REQUIRE secrets via `${{ secrets.X }}`, never inline.
    - path: ".gitleaks.toml"
      instructions: >-
        Secret-scan config shared by the local pre-commit hook and the gitleaks Action. Allowlist must be CONSERVATIVE — question any new broad `paths` entry, any `commits` entry, and any `stopwords` (stopwords risk false negatives; prefer path allowlists). Must cover *.enc files.
    - path: ".pre-commit-config.yaml"
      instructions: >-
        The `repo:` entry for github.com/repbyrepdev/claude-workflow-core pins a `rev:` tag in a PRIVATE repository the review sandbox cannot fetch. Do NOT flag that `rev:` as a non-existent or unverifiable tag — see `pricing-team-toolkit#123` — its existence is verified by `pre-commit` install and CI (CR-in-CI does not flag it; only the offline CLI sandbox does). Only flag a `rev:` that is obviously malformed — i.e. not a semver-style `vMAJOR.MINOR.PATCH` tag (optionally with a `-prerelease` and/or `+build` suffix) and not a 40-char commit SHA — or one whose version disagrees with the same plugin's version referenced elsewhere in the repo.
    - path: "pre-commit-hooks/*.sh"
      instructions: >-
        Pre-commit gate. REQUIRE `set -euo pipefail` on line 2. REQUIRE any bypass env var is documented in the header. REQUIRE it matches only staged files (git diff --cached). Exit 0 pass / 1 fail / 2 usage. FLAG hardcoded agent / anti-pattern lists that duplicate .github/commit-template.yml or .github/labels.yml SSOT (read via yq).
    - path: "scripts/*.sh"
      instructions: >-
        Plugin script (bootstrap / hash-drift / refresh-from-source / compose / release / test). REQUIRE `set -euo pipefail`. REQUIRE fail-closed on yq/jq/git errors — no `|| true` masking. Propagation scripts: a declared SSOT file that is missing must ABORT (exit 2), never silently skip — a silent skip is a coverage hole that disables the consumer drift gate.
    - path: ".claude/tests/**/*.bats"
      instructions: >-
        Bats test. The `# covers:` annotation is PER-FILE, not per-test: exactly ONE file-header line (space-separated targets) near the top of the FILE, read via grep -m1 — a SECOND covers line anywhere in the file is silently dropped, so do NOT request per-test covers annotations and do NOT flag a new @test block as "missing" one. Before flagging a missing covers line on a diff hunk, check the FILE HEADER (it is usually outside the hunk); flag only when the whole file truly has no covers line, or has more than one. REQUIRE behavior assertions (status + stdout/stderr content), not mere source-presence. REQUIRE trailing newline. FLAG skip-as-pass guards (`|| skip`) that silently neuter coverage on a missing optional tool.
    - path: ".claude/audit/prove-yourself.jsonl"
      instructions: >-
        APPEND-ONLY audit log. Each record's finding_text quotes the ORIGINAL finding verbatim — its action verb is a historical artifact, NOT a pending instruction. DO NOT suggest mutating prior records or rewriting entries. FLAG ONLY malformed JSON, missing required fields, or duplicate finding_id+ts pairs.
  # No reviews.labeling_instructions in this overlay (deliberate — #2256).
  # The base ships the single universal area:infrastructure PR label, whose
  # .github/labels.yml definition already covers "Skills, hooks, scripts,
  # workflows, repo infrastructure". The plugin uses that ONE broad area
  # label, NOT granular area:hooks/skills/workflows or type:test/type:secrets
  # — those were never defined in any repo's labels.yml (labels-spec.md
  # two-tier rule: labels.yml is generic-only; domain labels live in a
  # consumer overlay AND must be defined in that repo's labels.yml). Re-adding
  # domain labeling here would tell CR to apply labels no repo defines — the
  # exact media-server #956 drift this change removes at root.

  tools:
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    github-checks:
      # #2271/#2270: CI/CD pipeline log analysis — CR reads the GitHub Actions
      # check-run logs to surface pipeline failures in the review. In the base
      # SSOT so ALL consumers inherit it. timeout_ms = how long CR waits for the
      # checks to reach terminal before analyzing (CR default 90000; 120000 =
      # 2-min buffer for cold runners + the CodeRabbit check's own latency; max
      # 900000). Schema: docs.coderabbit.ai/tools/github-checks.
      enabled: true
      timeout_ms: 120000
    markdownlint:
      enabled: false # too noisy on CLAUDE.md/SKILL.md prose
    languagetool:
      enabled: false # ditto — silences "the the" on judgment-rule prose
chat:
  auto_reply: true
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    # Universal SSOT files present in every repo. Repos append repo-specific
    # guideline files (.claude/review-config.yml, .claude/ssot-checks.yml, ...)
    # via overlay.
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".github/commit-template.yml"
      - ".github/labels.yml"
      - ".github/required-checks-list.yml"
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
# Issue labels (type/priority/area) — auto-applied on new/edited issues.
# This is the CANONICAL location for ISSUE labeling (distinct from
# reviews.labeling_instructions, which is PR labeling). Repos append domain
# area:* labels via overlay.
issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      # Type — required, exactly one.
      - label: "bug"
        instructions: >-
          Apply when the issue describes broken/incorrect behavior or a regression. Keywords: "broken", "fails", "crashes", "regression", "not working", error messages quoted from logs.
      - label: "enhancement"
        instructions: >-
          Apply when the issue requests new functionality or extends existing features. Default for feature-style asks. Keywords: "add", "new", "support for", "feature".
      - label: "epic"
        instructions: >-
          Apply when the body has ≥3 occurrences of either `- [ ] #NNN` (sub-issue ref) OR `- [ ] vX.Y.Z:` (version-stamped task). Multi- phase work that decomposes into sub-issues.
      - label: "documentation"
        instructions: >-
          Apply when the issue is solely about CLAUDE.md / SKILL.md / docs updates with no code change.
      - label: "question"
        instructions: >-
          Apply when the issue is a clarification request, not actionable work.
      # Area — universal catch-all; repos add domain area:* via overlay.
      - label: "area:infrastructure"
        instructions: >-
          CI/CD, scripts, .claude/ tooling, .github SSOT, repo-bootstrap configs. Catch-all when no domain area matches.
      # Priority — required, exactly one. NEVER apply bare `priority:p0`.
      - label: "priority:p0-proposed"
        instructions: >-
          Production broken / active data loss / security-critical. NEVER apply bare `priority:p0` — always `p0-proposed` for operator confirmation.
      - label: "priority:p1"
        instructions: >-
          Blocking release, security-adjacent, or high-severity bug affecting users.
      - label: "priority:p2"
        instructions: >-
          Important, not blocking. Default for well-scoped features/tasks. Non-critical bugs and epics default to p2.
      - label: "priority:p3"
        instructions: "Polish work — nice to have, can wait weeks."
      - label: "priority:needs-triage"
        instructions: >-
          Apply when no area:* keyword matches the body — operator must manually classify before further action.
      # plan-me — triggers Issue Planner via auto_planning below.
      - label: "plan-me"
        instructions: >-
          Apply when the issue is `enhancement`, `epic`, or a generic well-scoped impl-ready task that benefits from structured phase decomposition. SKIP when the issue is `bug` (diagnostic), `documentation`, `question`, `brainstorm` (spec phase), already has `plan-me` (idempotent), `no-plan` (opt-out), or has any `auto:*` label (auto-generated — never plannable). ALSO SKIP when the issue BODY contains "auto-created from CodeRabbit plan" or "Auto-generated by `cr-plan parse" — that issue is cr-plan decomposition output (scaffolding); planning it recursively exploded the board on 2026-08-25, and the parser refuses such inputs anyway.
  planning:
    enabled: true
    auto_planning:
      enabled: true
      # Repos append their own `!auto:*` exclusions (trivy, restore-sanity, ...)
      # via overlay.
      labels:
        - "plan-me"
        - "!bug"
        - "!documentation"
        - "!question"
        - "!brainstorm"
        - "!no-plan"
        - "!auto:renovate"
# code_generation (#2297/#2272): plugin-ONLY CR docstring + unit-test generation
# guidance for this repo's shell surface (scripts/hooks/skills/_lib). Lives in the
# OVERLAY (not .coderabbit.base.yaml) so it does NOT propagate to consumers via
# bootstrap — the base stays repo-agnostic; a consumer wanting code-gen guidance
# adds its own overlay block. Schema: path_instructions nests under docstrings /
# unit_tests, NOT directly under code_generation (CodeRabbit config reference:
# docs.coderabbit.ai/reference/configuration) — a flat form is silently ignored,
# so coderabbit-config-sync.bats pins the correct nesting.
code_generation:
  docstrings:
    path_instructions:
      - path: "scripts/*.sh"
        instructions: >-
          Plugin propagation/CI script. Generate a header-comment block (purpose, usage/args, exit codes 0 pass / 1 fail / 2 usage) in the repo's existing style; keep `set -euo pipefail` on line 2 directly under the shebang. Reference the SSOT file a value derives from (.github/*.yml, read via yq) rather than restating it.
      - path: "pre-commit-hooks/*.sh"
        instructions: >-
          Pre-commit gate. Keep `set -euo pipefail` on line 2 (directly under the shebang); document the staged-files scope (git diff --cached), the bypass env var, and the 0/1/2 exit contract in the header.
      - path: "hooks/*.sh"
        instructions: >-
          Generic .claude hook. Keep `set -euo pipefail` on line 2 (directly under the shebang). Document the `# event:` it fires on and any bypass env var in the header; note repo_guard_require gating if present.
      - path: "skills/*/run.sh"
        instructions: >-
          Skill wrapper. Keep `set -euo pipefail` on line 2 directly under the shebang. Document the SKILL_WRAPPER side-effects it runs (preflight gates, Copilot draft, post-commit cascade) so callers do not bypass it.
      - path: "_lib/*.sh"
        instructions: >-
          Shared helper sourced by hooks/scripts. Document the functions it exports and their contracts; note it must stay bash-3.2 compatible (macOS — no mapfile / associative-array assumptions).
  unit_tests:
    path_instructions:
      - path: "**/*.sh"
        instructions: >-
          Generate bats tests, not ad-hoc scripts. REQUIRE exactly ONE `# covers:` line; assert behavior (exit status + stdout/stderr content), not mere source-presence; use `mktemp -d` fixtures; end the file with a trailing newline; never guard a required path behind `|| skip` (a silent pass).
