# Declarative SSOT for what bootstrap-repo.sh produces.
#
# Field types (consumers must encode the SAME shape):
#   schema_version: int — bump when removing/renaming a top-level section
#   files[].path:   string  — relative to target repo root
#   files[].mode:   string  — octal-as-string ("644", "755") — NOT decimal
#   files[].scope:  string  — optional; "plugin" | "consumer" | "both"
#     (absent ⇒ "both"). Consumer-only shims are skipped by
#     --verify --scope=plugin.
#   files[].hashed: bool — optional; true ⇒ this file is byte-SSOT (meant to
#     be byte-identical in EVERY repo). hash-drift.sh --generate hashes these
#     into .claude/.source-hashes.json, so refresh-from-source.sh re-propagates
#     them AND hash-drift.sh --verify drift-gates the consumer copy. Absent/
#     false ⇒ template-with-overrides or per-repo (bootstrap writes it once;
#     it is NOT byte-gated). The hashed set is the cross-repo byte-SSOTs: the
#     .github "process templates" (PR / commit / issue), the CodeRabbit base
#     (.coderabbit.base.yaml, #234), AND the AI-reviewer configs
#     (.gemini/policy.toml, .gemini/settings.json, .codex/config.toml, #236).
#     labels/required-checks/labeler/workflows
#     legitimately vary per repo and are propagated/gated by other mechanisms.
#     A consumer
#     that must customize a hashed file declares it in .claude/local-overrides.yml
#     (makes the divergence explicit instead of silent drift).
#   labels[].name:  string  — must match .github/labels.yml `name:`
#   labels[].color: string  — 6-hex-digit, lowercase, no leading #
#   labels[].description: string — optional; absent means "no description"
#   workflows / issue_templates: basename-only convenience arrays,
#     hand-maintained alongside files[] entries under .github/workflows/
#     and .github/ISSUE_TEMPLATE/. Kept explicit so consumer scripts
#     can iterate them without encoding the path-prefix filter.
#     Drift between these arrays and files[] is caught by the bats
#     "derived-view" parity tests.

schema_version: 1

files:
  - path: .pre-commit-config.yaml
    mode: "644"
  # AI-reviewer SSOT — byte-identical canonical CodeRabbit base (#234, Wave H).
  # hashed: true ⇒ the Wave G hash-drift engine gates + propagates it. The
  # per-repo .coderabbit.yaml is composed from this + an optional
  # .coderabbit.overlay.yaml by scripts/compose-coderabbit.sh (overlay scalars
  # win, arrays append). The overlay + composed .coderabbit.yaml are per-repo
  # (NOT gated, NOT in this manifest).
  - path: .coderabbit.base.yaml
    mode: "644"
    hashed: true
  # AI-reviewer configs (#236, Wave H residual) — byte-IDENTICAL across every
  # consumer (read-only Phase 0.5/0.7 reviewer policy + model settings; fully
  # repo-AGNOSTIC, no overlay needed), so full verbatim byte-SSOT. hashed: true
  # ⇒ the Wave G hash-drift engine gates + propagates them. Per-repo reviewer
  # CONTEXT (AGENTS.md / GEMINI.md prose) stays per-repo — NOT here.
  - path: .gemini/policy.toml
    mode: "644"
    hashed: true
  - path: .gemini/settings.json
    mode: "644"
    hashed: true
  - path: .codex/config.toml
    mode: "644"
    hashed: true
  # Consumer-only shims: the plugin itself doesn't need these because
  # it IS the plugin (its real skills live under skills/ship-pr-cycle/).
  # --verify --scope=both checks consumer paths; --verify --scope=plugin skips them.
  - path: .claude/skills/ship-pr-cycle/run.sh
    mode: "755"
    scope: consumer
  - path: .claude/skills/ship-pr-cycle/SKILL.md
    mode: "644"
    scope: consumer
  # Consumer-only: gitignored in plugin repo (plugin uses its own
  # hooks/review-log.sh at the top level).
  - path: .claude/hooks/review-log.sh
    mode: "755"
    scope: consumer
  # Consumer-only: ship-pr-cycle runtime shims (#223) — the phase0.5 + post-
  # commit stages invoke these stable paths; self-resolving shims to the
  # plugin cache (same pattern as review-log.sh above). NOT hashed (consumer).
  - path: .claude/hooks/phase0.5-copilot-prefilter.sh
    mode: "755"
    scope: consumer
  - path: .claude/hooks/post-commit-ship-cycle.sh
    mode: "755"
    scope: consumer
  # Consumer-only: the per-repo override scaffold bootstrap writes for new
  # consumers (v0.20.1 #147). Never byte-SSOT — its WHOLE PURPOSE is to record
  # a consumer's intentional divergences — so it is scope:consumer + NOT hashed.
  - path: .claude/local-overrides.yml
    mode: "644"
    scope: consumer
  # .github process templates — byte-SSOT (hashed: true). These define the
  # SAME PR / commit / issue experience in every repo; drift is gated by
  # hash-drift --verify and healed by refresh-from-source. Repo-flavoring
  # (commit examples, issue Area options) is handled via local-overrides.yml.
  - path: .github/pull_request_template.md
    mode: "644"
    hashed: true
  - path: .github/commit-template.yml
    mode: "644"
    hashed: true
  # Copilot reviewer pointer — byte-SSOT (hashed: true). A tiny, fully
  # repo-AGNOSTIC stub that redirects GitHub Copilot to the repo-root AGENTS.md
  # (the unified non-Claude-CLI reviewer contract). Identical in every repo, so
  # it joins the .gemini/.codex AI-reviewer byte-SSOT set (#236). Per-repo
  # reviewer CONTEXT stays in AGENTS.md (per-repo), never here.
  - path: .github/copilot-instructions.md
    mode: "644"
    hashed: true
  # labels / required-checks / labeler: template-with-overrides or per-repo —
  # NOT byte-gated (generic block + per-repo domain block / per-repo checks /
  # per-repo path globs). Bootstrap writes them once.
  - path: .github/labels.yml
    mode: "644"
  - path: .github/required-checks-list.yml
    mode: "644"
  - path: .github/labeler.yml
    mode: "644"
  - path: .github/ISSUE_TEMPLATE/bug.yml
    mode: "644"
    hashed: true
  - path: .github/ISSUE_TEMPLATE/feature.yml
    mode: "644"
    hashed: true
  - path: .github/ISSUE_TEMPLATE/task.yml
    mode: "644"
    hashed: true
  - path: .github/ISSUE_TEMPLATE/epic.yml
    mode: "644"
    hashed: true
  - path: .github/ISSUE_TEMPLATE/brainstorm.yml
    mode: "644"
    hashed: true
  # Cascade workflows: template-with-overrides (consumer slim heredoc vs full
  # plugin CI) — NOT byte-equal, NOT hashed.
  - path: .github/workflows/gitleaks.yml
    mode: "644"
  - path: .github/workflows/pr-lint.yml
    mode: "644"
  - path: .github/workflows/pr-labeler.yml
    mode: "644"

labels:
  - name: bug
    color: d73a4a
    description: Something broken
  - name: enhancement
    color: a2eeef
    description: New capability
  - name: epic
    color: 7057ff
    description: Parent of sub-issues
  - name: brainstorm
    color: c5def5
    description: Discussion-style ideation
  - name: priority:p1
    color: b60205
  - name: priority:p2
    color: d93f0b
  - name: priority:p3
    color: fbca04
  - name: priority:needs-triage
    color: 5319e7
  - name: area:infrastructure
    color: 0e8a16

workflows:
  - gitleaks.yml
  - pr-lint.yml
  - pr-labeler.yml

issue_templates:
  - bug.yml
  - feature.yml
  - task.yml
  - epic.yml
  - brainstorm.yml
