# Sub 3 (#141 of #138) — Consumer registry SSOT.
#
# Single source of truth for every repo that consumes this plugin. Read by:
#   * scripts/list-consumers.sh — operator-facing inventory (shipped)
#   * pre-commit-hooks/consumers-schema-check.sh — schema integrity gate (shipped)
#
# Future readers (not yet shipped — file when sub lands):
#   * scripts/refresh-from-source.sh (Sub 13 #151) — iterates targets for cascade
#   * scripts/cascade-to-consumers.sh (Sub 14 #152) — opens release-cascade issues
#   * meta-bootstrap.sh --target plugin --verify-only — registry presence check
#     (acceptance #4 of #141; wired separately in a follow-up sub)
#
# Schema (validated by pre-commit-hooks/consumers-schema-check.sh):
#   schema_version: int       — bump in lockstep with the validator
#   consumers:                — list of consumer records
#     - name: <string>        — operator-readable identifier; kebab-case by
#                               convention but not enforced by the validator
#                               (any non-empty string passes)
#       repo: owner/name      — GitHub coordinate (used by future cascade for
#                               `gh issue create --repo`)
#       local_path: ~/path    — operator machine path (used by future
#                               refresh-from-source.sh); intentionally
#                               machine-local, may be absolute
#       pinned_version: X.Y.Z — released-version pin; prerelease/build
#                               metadata deferred to schema v2
#       overrides_file: path  — relative to local_path; where .claude/local-
#                               overrides.yml lives
#       bootstrap_date: YYYY-MM-DD — first onboarded date. Value is
#                               informational (never gates downstream behavior),
#                               but the YYYY-MM-DD shape IS enforced (the
#                               regex is shape-only; impossible dates pass).
#       contact: @handle      — who pings on plugin breaking change
#       notes: free-form      — short context — domain, idiosyncrasies,
#                               deferred-cleanup pointers
#
# Adding a consumer: edit this file + open an issue in the consumer repo.
# (Future, after Sub 14 #152 ships: the post-release cascade will auto-
#  open that issue; for now it's an operator step.)

schema_version: 1

consumers:
  - name: media-server
    repo: repbyrepdev/plex_arr_media_stack
    local_path: ~/media-server
    pinned_version: "0.34.29"
    overrides_file: .claude/local-overrides.yml
    bootstrap_date: 2026-04-21
    contact: "@damien"
    notes: |
      Domain: homelab (Docker compose, Plex/Sonarr/Radarr, Grafana/Loki).
      Has 81 .claude/hooks/ entries — most should be deduplicated post-Sub-8 (#146).
      Has 19 .github/workflows/ — most domain-specific (dr-test, encrypt-corpus, etc.)
      plus 4 duplicated with plugin (pr-lint, gitleaks, pr-labeler, label-sync).

  - name: pricing-team-toolkit
    repo: FCP-Euro-Pricing-Team/pricing-team-toolkit
    local_path: ~/pricing-team-toolkit
    pinned_version: "0.34.29"
    overrides_file: .claude/local-overrides.yml
    bootstrap_date: 2026-05-15
    contact: "@damien"
    notes: |
      Domain: data engineering (Coalesce, Snowflake, Sigma, Hex).
      Thin consumer — 3 unique .claude/hooks/ (coalesce-gracie-only-gate + deps).
      10 .github/workflows/; 4 duplicated with plugin. Domain-specific labels:
      area:coalesce, area:hex, area:sigma, upstream:coalesce/pricing-docs.
