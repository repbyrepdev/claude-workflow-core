# Gold-standard commit-message schema for this repo.
#
# Consumed by:
#   - skills/git-commit/run.sh — drafts via Copilot gpt-4.1 using this as system context
#   - pre-commit-hooks/commit-template-check.sh — schema drift guard
#   - hooks/post-commit-template-lint.sh — post-commit lint, warns on drift
#
# Convention: Conventional Commits 1.0.0 + 70-char subject cap + body required
# for feat/fix/refactor/perf explaining the WHY (not the WHAT).
#
# This is SSOT. All downstream tooling reads from here — do not restate rules
# in CLAUDE.md or skill prose. Update here and downstream auto-conforms.

schema:
  subject:
    max_length: 70
    format: "<type>(<optional_scope>): <summary>"
    types:
      - feat      # new capability (user-visible or infra)
      - fix       # bug fix
      - refactor  # code restructure, no behavior change
      - perf      # performance improvement
      - chore     # maintenance (deps, tooling, renames)
      - test      # test-only changes
      - docs      # docs/comments only
      - build     # build system / packaging
      - ci        # CI / workflow changes
      - revert    # revert of prior commit
    scope_optional: true
    scope_examples: [v0.9.5, v0.9, vX.Y, vX.Y.Z, skills, hooks, scripts]

  body:
    required_for: [feat, fix, refactor, perf]
    optional_for: [chore, test, docs, build, ci, revert]
    format: "Plain prose explaining WHY not WHAT. 1-2 sentences minimum on required types."
    separator: "One blank line between subject and body"

  footer:
    trailers:
      - pattern: "Closes #<N>"
        purpose: "Auto-closes the referenced issue on merge"
      - pattern: "Advances #<N>"
        purpose: "Progress on an epic without closing"
      - pattern: "Co-Authored-By: <Name> <email>"
        purpose: "Multi-author attribution — MANDATORY for Claude-assisted commits"

# Exemplar commits showing the gold-standard shape. Drawn from this repo
# where possible (v0.9.4 #54 — the most recent shippable PR at backport time).
# Match this structure, tone, and specificity.
examples:
  - scope: "fix with tight why"
    content: |
      fix(v0.9.4): test runner — 2 set -euo pipefail aborts (#53)

      CR-CLI flagged 2 silent-failure issues on the merged PR #51. Both also
      exist upstream.

      Bug 1: grep -E pipeline returns rc=1 on no-match. Under set -euo
      pipefail, truncates summary output. Fix: || true on both pipelines.

      Bug 2: find aborts when starting roots are missing. Plugin root doesn't
      ship .claude/scripts or .claude/hooks. Fix: pre-filter via [ -d ] check.

      Closes #53
      Advances #52

      Co-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>

  - scope: "test with regression coverage"
    content: |
      test(v0.9.4): 3 final regression tests for #53

      F1: '50% partial coverage' test exercises pct integer arithmetic at
      non-boundary point (boundary tests miss numerator/denominator flips).

      F2: 'Coverage: 0%' assertion added to 'every .sh root populated' test
      locks in end-to-end coverage block completion.

      F3: 'TEST_REPO_ROOT override active' assertion added to plugin-shape
      catches typo'd self-assign of REPO_ROOT.

      Advances #53

      Co-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>

  - scope: "feat with explicit scope"
    content: |
      feat(v0.9.5): backport .github SSOT + yamllint to plugin

      Plugin had no .github directory while shipping templates to consumers
      via bootstrap-repo.sh. Own skills epic-creation + issue-creation failed
      on the plugin itself.

      Backported from bootstrap-repo.sh + homelab SSOT:
      - .github/labels.yml (9 labels created on GitHub)
      - .github/ISSUE_TEMPLATE/{bug,feature,task,epic,brainstorm}.yml
      - .github/commit-template.yml (full schema)
      - .yamllint.yaml (relaxed + line-length disable)

      Co-Authored-By: Claude Opus 4.7 <noreply@anthropic.com>

# Anti-patterns — commit messages in these shapes should be REFUSED by the
# skill wrapper + flagged by the post-commit lint. Exemplars of what NOT to do.
anti_patterns:
  - pattern: "updated files"
    why: "Describes WHAT changed (duplicating the diff) without WHY"
  - pattern: "fixed bug"
    why: "No context. Which bug? What was the root cause?"
  - pattern: "wip"
    why: "Work-in-progress commits should never reach main"
  - pattern: "misc / stuff / things / changes"
    why: "Meaningless. Split or rewrite with a specific summary"
  - pattern: "Let Claude do X"
    why: "Self-attribution in subject line. Use Co-Authored-By footer instead"
  - pattern: "Subject line >70 chars"
    why: "GitHub UI truncates. Use body for details"
  - pattern: "Missing body on feat/fix/refactor/perf"
    why: "Required types must explain WHY — not optional"
  - pattern: "Subject in all caps / missing conventional prefix"
    why: "Breaks categorization for release-notes auto-generation"
