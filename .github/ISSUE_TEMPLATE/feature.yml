name: Feature request
description: New capability
labels: [enhancement]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: "Issue number of the parent epic (e.g. `#56`). Sub-issues without a parent orphan in Backlog with no epic-progress correlation."
      placeholder: "#NNN"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: AI triage reads this and applies the matching area:* label automatically.
      options:
        - Infrastructure
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What's the goal?
    validations:
      required: true
