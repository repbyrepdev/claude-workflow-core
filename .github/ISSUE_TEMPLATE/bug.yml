name: Bug report
description: Something broken
labels: [bug]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic
      description: "Required — link the parent epic this work rolls up to (`#NNN`)."
      placeholder: "#NNN"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: AI triage reads this and applies the matching area:* label automatically.
      options:
        - Infrastructure
        - Docs
        - Plugin-manifest
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What's happening?
    validations:
      required: true
