---
# Path → label rules consumed by pr-labeler.yml workflow.
# See https://github.com/actions/labeler for syntax.
#
# Every plausible changed path must map to at least one area:* label,
# otherwise pr-lint never runs (no labeled event fires → required
# check stays pending → merge blocked).
area:infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - .github/**
          - .claude/**
          - .pre-commit-config.yaml
          - .pre-commit-hooks.yaml
          - .shellcheckrc
          - hooks/**
          - pre-commit-hooks/**
          - skills/**
          - _lib/**
          # #2314: top-level config files/dirs that existed but matched no glob —
          # a PR touching ONLY these got no area label, so pr-lint stayed pending
          # and blocked merge. (.coderabbit*.yaml added beyond the CR plan list —
          # same verified gap.) Phase2 CR r1 extended the same class to
          # .gitignore + .memory-aliases (both verified via `git ls-files`);
          # biome.json was rejected — it does not exist in this repo.
          - .coderabbit*.yaml
          - .gitleaks.toml
          - .yamllint.yaml
          - .semgrep/**
          - .codex/**
          - .gemini/**
          - templates/**
          - agents/**
          - .gitignore
          - .memory-aliases
          # Same #2314 class: a top-level config file matching no glob means a
          # PR touching only it gets no area label, so pr-lint stays pending
          # and merge blocks. Caught by labeler-yml.bats once its assertions
          # could actually fail.
          - .markdownlint-cli2.jsonc
area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "**/*.md"
          - LICENSE
          # (#2629) The generated evidence index. Its pages are .md and would
          # match above, but openwiki/ also carries non-.md artifacts (the
          # .last-update.json watermark), and a PR touching only those would
          # otherwise get no area label at all.
          - openwiki/**
area:plugin-manifest:
  - changed-files:
      - any-glob-to-any-file:
          - .claude-plugin/**
