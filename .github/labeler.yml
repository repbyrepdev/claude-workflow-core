---
# Path → label rules consumed by pr-labeler.yml workflow.
# See https://github.com/actions/labeler for syntax.
#
# Every plausible changed path must map to at least one area:* label,
# otherwise pr-lint never runs (no labeled event fires → required
# check stays pending → merge blocked).
area:infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - .github/**
          - .claude/**
          - .pre-commit-config.yaml
          - .pre-commit-hooks.yaml
          - .shellcheckrc
          - hooks/**
          - pre-commit-hooks/**
          - skills/**
          - _lib/**
          # #2314: top-level config files/dirs that existed but matched no glob —
          # a PR touching ONLY these got no area label, so pr-lint stayed pending
          # and blocked merge. (.coderabbit*.yaml added beyond the CR plan list —
          # same verified gap.)
          - .coderabbit*.yaml
          - .gitleaks.toml
          - .yamllint.yaml
          - .semgrep/**
          - .codex/**
          - .gemini/**
          - templates/**
          - agents/**
area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "**/*.md"
          - LICENSE
area:plugin-manifest:
  - changed-files:
      - any-glob-to-any-file:
          - .claude-plugin/**
