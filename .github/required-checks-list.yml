# SSOT for required status checks. Branch protection on main reads
# this list; pr-merge skill validates each is present + green before
# proceeding.
#
# Schema (per entry):
#   check_name:    string  — exact GitHub check name (CodeRabbit, pr-lint, …)
#   workflow_file: string|null — workflow file under .github/workflows/ that
#                  produces this check. null for third-party / server-side
#                  checks (e.g. CodeRabbit). Consumers may skip entries
#                  where workflow_file is null when running checks locally.
#   event:         string|null — the event that fires the workflow
#                  (pull_request, push, schedule). null when workflow_file
#                  is null.
#   notes:         string  — free-form one-line description of what the
#                  check does (multi-line via YAML | block when needed).
#
# advisory[]: same schema; these checks run locally / informationally but
#   are NOT yet in branch protection's required list. Promote to required[]
#   at operator discretion.

required:
  - check_name: CodeRabbit
    workflow_file: null
    event: null
    notes: Third-party SaaS review; runs server-side, not in Actions.
  - check_name: gitleaks
    workflow_file: gitleaks.yml
    event: pull_request, push
    notes: Secret scan with custom allowlist via .gitleaks.toml
  - check_name: pr-lint
    workflow_file: pr-lint.yml
    event: pull_request
    notes: |
      Sequential checks enforcing area:* label, issue link, and PR
      template section headings — see pr-lint.yml for exact step list.
      Intentionally omits the `opened` trigger (fires on `labeled` instead)
      so pr-labeler's area:* labels are present before check-labels runs
      (#356/#357 race fix); the area label is derived from .github/labeler.yml,
      which must therefore cover every changed path (see #2314).
  - check_name: verify
    workflow_file: plugin-self-bootstrap-verify.yml
    event: pull_request
    notes: |
      Plugin self-bootstrap parity gate (#108): bootstraps this plugin into a
      clean tree and asserts the emitted SSOT files match the live ones. Made
      required (#2234) — it is fast and deterministic and passes on every PR, so
      enforcing it mechanically gates bootstrap drift before merge. Plugin-scoped:
      consumers
      do not run this workflow and required-checks-list.yml is a per-repo seed
      (NOT byte-gated), so this entry stays OUT of the bootstrap heredoc.

advisory: []
