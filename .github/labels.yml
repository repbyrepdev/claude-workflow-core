# Label catalog — SINGLE SOURCE OF TRUTH for this repo + plugin-consumer
# SSOT for the GENERIC label set shared across all consumer repos.
#
# v0.19.0 (#142): promoted the union-of-generic-labels from media-server +
# pricing-team-toolkit. Domain-specific labels (homelab area:streaming,
# data-eng area:coalesce, etc.) live in each consumer's local-overrides.yml
# (Sub 9 #147). See .github/labels-spec.md for the promotion rule.
#
# Synced to GitHub by .github/workflows/label-sync.yml on push to main that
# changes this file (workflow landing in Sub 6 #144 of v0.19 epic). Manual
# one-shot today: `gh label create <name> --color <hex> --description "..."`
# OR `scripts/bootstrap-repo.sh --apply-labels` after Sub 6 lands.
#
# 8-color Primer palette (kept in sync across plugin / homelab / FCP):
#   Red     cf222e  priority:p0 · priority:p1 · bug · major
#                   · auto:trivy-scan / trivy-post-merge
#   Orange  bc4c00  priority:p0-proposed · status:in-review
#   Yellow  bf8700  priority:p2 · minor · plan-me
#   Green   1a7f37  priority:p3 · auto:renovate · patch
#   Blue    0969da  documentation
#   Purple  8250df  area:infrastructure · epic · brainstorm
#   Pink    bf3989  question
#   Gray    6e7681  priority:needs-triage · status:blocked · enhancement
#                   · no-plan
# -----------------------------------------------------------------------------

# ---- Type ----
- name: bug
  color: "cf222e"
  description: Something isn't working
- name: enhancement
  color: "6e7681"
  description: New feature or improvement
- name: epic
  color: "8250df"
  description: Parent of sub-issues (multi-PR scope)
- name: brainstorm
  color: "8250df"
  description: Discussion-style ideation, no concrete scope yet
- name: documentation
  color: "0969da"
  description: Improvements or additions to documentation
- name: question
  color: "bf3989"
  description: Further information is requested

# ---- Priority (applied by ai-triage; p0-proposed never auto-escalates) ----
- name: priority:p0
  color: "cf222e"
  description: Production broken — fix immediately
- name: priority:p0-proposed
  color: "bc4c00"
  description: AI-flagged as critical — human approval required (never auto-escalates)
- name: priority:p1
  color: "cf222e"
  description: Urgent — fix this week
- name: priority:p2
  color: "bf8700"
  description: Important — fix this milestone
- name: priority:p3
  color: "1a7f37"
  description: Nice-to-have — backlog
- name: priority:needs-triage
  color: "6e7681"
  description: AI triage couldn't classify confidently — human review needed

# ---- Status (board-driven, labels mirror for querying) ----
- name: status:in-review
  color: "bc4c00"
  description: PR open awaiting review
- name: status:blocked
  color: "6e7681"
  description: Waiting on dependency / external blocker

# ---- Area — generic cross-domain only ----
# Consumer repos add their own domain `area:*` in local-overrides.yml.
- name: area:infrastructure
  color: "8250df"
  description: Skills, hooks, scripts, workflows, repo infrastructure
- name: area:docs
  color: "8250df"
  description: README + markdown documentation
- name: area:plugin-manifest
  color: "8250df"
  description: .claude-plugin/plugin.json + marketplace metadata (plugin-domain)

# ---- Auto (applied by source workflows; skip-guard on ai-triage) ----
# Domain-specific auto labels (auto:dr-test, auto:restore-sanity, auto:rollback,
# etc.) live in each consumer's local-overrides.yml — the ones declared
# here are generic enough that every consumer can use them.
- name: auto:renovate
  color: "1a7f37"
  description: Renovate-generated PRs + dashboard
- name: auto:trivy-scan
  color: "cf222e"
  description: Weekly Trivy CVE scan findings
- name: auto:trivy-post-merge
  color: "cf222e"
  description: Post-merge Trivy scan on newly-landed image SHAs

# ---- Renovate update-type (added by renovate.json packageRules) ----
- name: patch
  color: "1a7f37"
  description: Patch-level dependency update
- name: minor
  color: "bf8700"
  description: Minor-level dependency update
- name: major
  color: "cf222e"
  description: Major-level dependency update (manual approval via dashboard)

# ---- CR Issue Planner (v4.28-W5 / cr-plan skill — v0.7+) ----
# REQUIRED for the cr-plan skill that ships in this plugin. Before v0.19.0
# these were declared only in consumer repos; the skill was broken-as-shipped
# for repos that consumed the plugin but hadn't added these labels manually.
- name: plan-me
  color: "8250df"
  description: Apply to issue to invoke @coderabbitai Issue Planner
- name: no-plan
  color: "6e7681"
  description: "Operator opt-out: do not run cr-plan trigger on this issue"
