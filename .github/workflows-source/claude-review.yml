name: Claude Review

# #2571 (backup-approver half): a fresh-context Claude review of every PR,
# submitted as a REAL GitHub review under the github-actions[bot] identity.
# Purpose: redundancy for the #2567 approving-review merge gate — CodeRabbit
# is otherwise the ONLY producer of an APPROVED record (Copilot's PR bot
# never submits Approve), so a CR outage or rate-limit pause is a merge
# stall. This reviewer is the designed backup, not the primary: CR-in-CI
# stays a required check; this workflow is deliberately NOT required.
#
# Independence posture: the review runs in a FRESH context (no session
# state), under a separate identity from the commit author, with an
# adversarial prompt. It approves only when it finds nothing material.
#
# DORMANT until the token secret exists (secrets.CLAUDE_CODE_OAUTH_TOKEN,
# via claude setup-token). A second ACTIVATION PREREQUISITE — the repo
# setting "Allow GitHub Actions to create and approve pull requests" —
# gates the Approve submission itself: with the token set but the setting
# off the workflow is ACTIVE and fails RED via the mechanical verify step
# (loud, not dormant).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# Deny by default at workflow scope; the review job grants exactly what
# it needs. A future job inherits nothing (p2r4 CR).
permissions: {}

# One run per PR at a time — a new push supersedes the in-flight review.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude fresh-context backup review
    # Draft PRs are not reviewable intents yet.
    if: ${{ !github.event.pull_request.draft }}
    # Job-scoped, least-privilege (phase2 CR). Nothing else.
    permissions:
      contents: read # checkout of the PR head (read-only tree)
      pull-requests: write # gh pr review submission + reviews-API verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check token present (dormant until operator sets it)
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::notice::claude-review is DORMANT — set the CLAUDE_CODE_OAUTH_TOKEN repo secret (claude setup-token) to activate the backup approver (#2571)."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR head
        if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The reviewer only READS the checkout; leaving the default
          # credential persisted in .git/config is an unnecessary token
          # exposure to anything that touches the tree (p2 CR).
          persist-credentials: false

      - name: Claude fresh-context review
        if: steps.gate.outputs.active == 'true'
        uses: anthropics/claude-code-action@c81e3bc69d1b18badbb63ba39581218f02421678 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Explicit github_token pins the review IDENTITY to
          # github-actions[bot] — matching the approval-policy line and the
          # Actions-can-approve setting. Without it the action mints a
          # Claude-App token via OIDC (needs id-token:write we do not grant)
          # and reviews would post as claude[bot], never matching the
          # policy (r1 code-reviewer criticals 2+3).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--allowedTools 'Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Grep,Glob'"
          prompt: |
            You are the BACKUP reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}
            (head ${{ github.event.pull_request.head.sha }}). You did not write this code; review it
            adversarially and in full.

            1. Read the diff: `gh pr diff ${{ github.event.pull_request.number }}`. Read surrounding
               files as needed for context.
            2. Hunt real defects: correctness, silent failures, security, laundering/bypass paths in
               gates or hooks, test dishonesty (assertions that cannot fail), doc claims the code
               contradicts.
            3. BEFORE submitting, re-check the head is still the one you reviewed:
               `gh pr view ${{ github.event.pull_request.number }} --json headRefOid` must equal
               ${{ github.event.pull_request.head.sha }}. If it moved, STOP without submitting —
               a newer run supersedes you, and a review submitted now would attach to a head
               you did not read (the API stamps commit_id at submission time).
            4. Then submit EXACTLY ONE formal review of the CURRENT head:
               - Nothing material found:
                 `gh pr review ${{ github.event.pull_request.number }} --approve --body "<what you checked + why it is clean>"`
               - Material findings:
                 `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<numbered findings with file:line>"`
            5. If the review submission is REJECTED by GitHub, state loudly in your output that the
               repo setting "Allow GitHub Actions to create and approve pull requests" is off (#2571)
               — do not retry, do not fall back to a plain comment labeled as an approval.

            Approve ONLY when you found nothing material. A hedged approval is worse than
            requested changes.

      - name: Verify a review was actually submitted (mechanical, not prompt-trusted)
        # r1 silent-failure F16: without this, a rejected Approve (setting
        # off) or a model that submitted nothing leaves a GREEN job and an
        # invisible gap — the merge gate then stalls with nothing saying
        # why. Non-required workflow, so a red job is a visible signal, not
        # a merge blocker.
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # p2r5 CR: strict mode — an unnoticed command failure here would
          # skip the whole verification this step exists to guarantee.
          set -euo pipefail
          # CI r1 TOCTOU guard: if the PR head moved past this run's sha, a
          # newer run owns the review — this run is SUPERSEDED, not failed.
          # Going red here would blame a healthy pipeline for a normal race.
          # The live sha must VALIDATE before the compare: an empty/garbage
          # API answer must fail RED, never read as "superseded" (that
          # would silently skip verification — fail-open).
          live=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)
          if ! printf '%s' "$live" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::could not resolve the live PR head (got '${live}') — cannot verify the review submission."
            exit 1
          fi
          if [ "$live" != "$HEAD_SHA" ]; then
            echo "::notice::superseded — PR head moved (${HEAD_SHA} -> ${live}); the newer run's verify step owns the check."
            exit 0
          fi
          # jq -s 'add' merges --paginate's per-page arrays BEFORE counting
          # (per-page --jq would emit one count per page and break the -lt).
          # HEAD_SHA rides --arg (data channel), not shell interpolation
          # into the program (p2r4 CR).
          n=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --paginate |
            jq -s --arg head "$HEAD_SHA" 'add // [] | [.[] | select(.user.login == "github-actions[bot]" and .commit_id == $head)] | length')
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::claude-review ran but NO github-actions[bot] review exists for head ${HEAD_SHA}. Likely causes: repo setting 'Allow GitHub Actions to create and approve pull requests' is OFF (#2571), or the reviewer submitted nothing."
            exit 1
          fi
          echo "review present for ${HEAD_SHA} (count=${n})"
