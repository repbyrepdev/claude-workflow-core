name: Plugin self-bootstrap verify

# Runs bootstrap-repo.sh --verify --scope plugin against the plugin's
# own repo on every push/PR. Prevents shipping a release where the
# plugin's own .github/* has drifted from what bootstrap-manifest.yml
# declares it produces.
#
# The verify script reads only checked-in YAML; the only external
# fetch is the pinned yq release tarball from GitHub.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # issues:read grants access to repository.labels via GraphQL (required by
  # `gh label list` inside _verify_target's label-remote check).
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install yq (pinned tag + checksum-verified from release)
        env:
          YQ_VERSION: v4.52.5
          YQ_ASSET: yq_linux_amd64
        run: |
          set -euxo pipefail
          # Download binary + its checksums.txt from the same release tag
          # (release tag pins the upstream version; checksums.txt pins
          # the binary integrity within that tag).
          curl -fsSL --retry 3 -o /tmp/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_ASSET}"
          curl -fsSL --retry 3 -o /tmp/yq.checksums \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums"
          # mikefarah/yq checksums format: `<asset_name>  <hash1>  <hash2> ...`
          # (asset in field 1, multiple hash types in subsequent fields).
          # Extract the sha256 column via `checksums_hashes_order` file
          # would be more robust, but for v4.52.5 the sha256 is at a
          # known column. Use sha256sum --check via a synthesized line.
          expected_line=$(awk -v a="${YQ_ASSET}" '$1==a{print; exit}' /tmp/yq.checksums)
          if [ -z "$expected_line" ]; then
            echo "yq install: checksum for ${YQ_ASSET} missing from release checksums file" >&2
            exit 1
          fi
          # Field 19 in the checksums file is sha256 per mikefarah/yq
          # checksums_hashes_order (asset, then sha-1/sha-224/sha-256/...
          # in 18 columns of different hash types). Operator dogfood:
          # `curl -s .../checksums_hashes_order` to verify the column.
          expected=$(echo "$expected_line" | awk '{print $19}')
          if ! [[ $expected =~ ^[0-9a-f]{64}$ ]]; then
            echo "yq install: extracted sha256 has unexpected shape ('$expected')" >&2
            echo "  Verify checksums_hashes_order at https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums_hashes_order" >&2
            exit 1
          fi
          actual=$(sha256sum /tmp/yq | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "yq install: checksum mismatch for ${YQ_ASSET}" >&2
            echo "  expected: $expected" >&2
            echo "  actual:   $actual" >&2
            exit 1
          fi
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
      - name: Run bootstrap-repo.sh --verify --scope plugin
        env:
          # Required for the label-remote check (gh label list) inside _verify_target.
          # Without GH_TOKEN, gh CLI errors and the script fails closed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          scripts/bootstrap-repo.sh . --verify --scope plugin
