name: PR Lint

on:
  # v4.0 post-release fix (#356 / PR #357): intentionally OMIT `opened` from
  # trigger types. pr-labeler.yml runs in parallel to pr-lint on PR open, and
  # on fresh PRs check-labels lost the race ~100% of the time: queried labels
  # before pr-labeler had applied them, went FAILURE, sent a GitHub app
  # notification, then the `labeled` event re-fired pr-lint with labels
  # present → SUCCESS. The red → green flip was cosmetically ugly and
  # burned notifications on every PR.
  #
  # Dropping `opened` means the FIRST pr-lint run on a fresh PR is triggered
  # by `labeled` (pr-labeler's output), so labels are guaranteed present when
  # check-labels queries them. No race, no false-red, no app ping.
  #
  # Edge case: a PR whose paths match NO rule in .github/labeler.yml gets no
  # auto-label → no `labeled` event → pr-lint never runs → check-labels stays
  # "required check pending" → merge blocked until a human applies a label
  # manually (which fires `labeled` → pr-lint runs → passes). Stricter than
  # the old behavior; safer failure mode.
  #
  # `synchronize` catches new pushes. `edited` catches PR body edits. Both
  # re-fire the body-based checks (check-issue-link + check-pr-template-sections).
  pull_request:
    types: [edited, labeled, unlabeled, synchronize]

# Pure read-only label/body check. No write, no secrets needed.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # actions/checkout needs this — setting any perm defaults the rest to none
  pull-requests: read

# v4.3.E (#371): consolidated from 3 parallel jobs into 1 job with 3 steps.
# GitHub Actions bills rounded up to 1 minute per job. Each pr-lint check
# takes <2s, but 3 parallel jobs billed 3 min/run regardless. At ~800
# runs/week this workflow alone consumed ~82% of the 3,000-min monthly cap
# during heavy ship weeks. Consolidation drops billing 3 min → 1 min per
# run without any coverage change.
#
# Branch protection required-check list is updated in tandem with rollout:
# the old names (`check-labels`, `check-issue-link`, `check-pr-template-sections`)
# are replaced by a single `pr-lint` name when the cap-era deferral (#366)
# is reversed.
jobs:
  pr-lint:
    runs-on: ubuntu-latest
    # Skip for Renovate PRs (auto-labeled) and rollback PRs (auto-generated by maintain.sh).
    # Kept at the job level so all 3 checks skip together — they're always
    # co-applicable (Renovate PRs have no linked issue + no template body either).
    if: "!contains(github.event.pull_request.labels.*.name, 'auto:renovate') && !contains(github.event.pull_request.labels.*.name, 'auto:rollback')"
    # BODY lifted to job-level env so both body-dependent steps share it.
    env:
      BODY: ${{ github.event.pull_request.body }}
    steps:
      # v4.4.A: checkout so the step can read `.github/labels.yml` as SSOT.
      # Earlier debug detour: thought persist-credentials: false was breaking
      # checkout — was actually missing `contents: read` in the permissions
      # block above (any explicit permission defaults the rest to none).
      # Now with contents: read granted, persist-credentials: false is safe.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require area label
        # First step — no `if: always()` needed; a failure here still aborts
        # the job correctly. Steps 2+3 use `if: always()` to preserve the
        # pre-v4.3.E behavior where the parallel-job layout surfaced ALL
        # failures per run, not just the first.
        env:
          # CR PR #64 r2 MAJOR: pass labels via env (not inline shell
          # interpolation) to defeat label-name injection (a label with
          # a single-quote would break the inline `LABELS='...'` form).
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          LABELS="$LABELS_JSON"
          # v4.4.A: area label names derived from `.github/labels.yml` at
          # run-time — SINGLE source of truth. Adding a new area:* label
          # in labels.yml is immediately accepted without editing this
          # workflow. Uses yq (install step added to this step to avoid a
          # whole-job dependency).
          if ! command -v yq >/dev/null 2>&1; then
            # Supply-chain hardening: download yq + the release's
            # checksums file + extract-checksum.sh, then verify sha256
            # before installing. Mirrors the pattern in
            # .github/workflows-source/plugin-self-bootstrap-verify.yml.
            YQ_VERSION=v4.52.5
            YQ_ASSET=yq_linux_amd64
            curl -fsSL --retry 3 -o /tmp/yq \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/${YQ_ASSET}"
            curl -fsSL --retry 3 -o /tmp/yq.checksums \
              "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/checksums"
            # Field 19 is sha256 per mikefarah/yq checksums_hashes_order
            # (sha-1, sha-224, sha-256, ... in 18 hash columns + asset name).
            # Operator dogfood: curl checksums_hashes_order for that release
            # to verify the column index if it ever changes upstream.
            expected_line=$(awk -v a="${YQ_ASSET}" '$1==a{print; exit}' /tmp/yq.checksums)
            expected=$(echo "$expected_line" | awk '{print $19}')
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::yq install: extracted sha256 has unexpected shape ('$expected')"
              exit 1
            fi
            actual=$(sha256sum /tmp/yq | awk '{print $1}')
            if [ "$expected" != "$actual" ]; then
              echo "::error::yq install: checksum mismatch (expected $expected, got $actual)"
              exit 1
            fi
            sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          fi
          AREA_LABELS=$(yq -r '.[] | select(.name | test("^area:")) | .name' .github/labels.yml | tr '\n' ' ')
          if [ -z "$AREA_LABELS" ]; then
            echo "::error::.github/labels.yml has no area:* entries"
            exit 1
          fi
          FOUND=false
          for label in $AREA_LABELS; do
            if echo "$LABELS" | grep -q "\"$label\""; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = "false" ]; then
            echo "::error::PR must have an area:* label (one of: $AREA_LABELS)"
            exit 1
          fi

      - name: Require issue reference
        # v4.3.E: `if: always() && !cancelled()` replicates the pre-consolidation
        # parallel-job behavior where each check ran independently. Without
        # this, step 1's failure would skip this step — author fixes step 1
        # → repushes → discovers step 2 failure → repushes again. Multiplying
        # CI cycles for no gain. With `always()`, the job surfaces ALL failing
        # checks per run (same UX as before) while still billing as 1 job.
        if: always() && !cancelled()
        run: |
          if echo "$BODY" | grep -qiE "(close[sd]?|fix(e[sd])?|resolve[sd]?|advance[sd]?) #[0-9]+"; then
            echo "Issue link found"
          else
            echo "::error::PR body must reference an issue (e.g., 'Closes #47' or 'Advances #47')"
            exit 1
          fi

      # v3.21.2: PR body must mirror .github/pull_request_template.md structure.
      # Previously authoring custom "Summary / Test plan / Closes" bodies blew past
      # Pre-merge checklist + Rollback sections. This check enforces the template
      # section headings (not the checkbox states — operator fills those).
      - name: Require PR template section headings
        if: always() && !cancelled()
        run: |
          MISSING=""
          for heading in "## Summary" "## Test plan"; do
            if ! echo "$BODY" | grep -qF "$heading"; then
              MISSING="$MISSING $heading"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::PR body missing required template sections:$MISSING"
            echo "::error::Read .github/pull_request_template.md and mirror its section structure."
            exit 1
          fi
          echo "All required template sections present"
