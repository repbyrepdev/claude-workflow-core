name: Plugin self-bootstrap verify

# Runs bootstrap-repo.sh --verify --scope plugin against the plugin's
# own repo on every push/PR. Prevents shipping a release where the
# plugin's own .github/* has drifted from what bootstrap-manifest.yml
# declares it produces. No untrusted input is consumed in this
# workflow — the script reads only its own checked-in YAML manifest.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install yq
        run: |
          sudo wget -q -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.52.5/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Run bootstrap-repo.sh --verify --scope plugin
        run: scripts/bootstrap-repo.sh . --verify --scope plugin
