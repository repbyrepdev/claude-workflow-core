name: Gitleaks Secret Scan

on:
  pull_request:
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # Skip for Renovate PRs and rollback PRs (auto-generated, no secret changes)
    if: "!contains(github.event.pull_request.labels.*.name, 'auto:renovate') && !contains(github.event.pull_request.labels.*.name, 'auto:rollback')"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_CONFIG omitted — claude-workflow-core has no
          # .gitleaks.toml. Default rules apply. Follow-up: backport
          # .gitleaks.toml from homelab + flip env back on.
